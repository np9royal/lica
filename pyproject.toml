[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lica"
version = "0.1.0"
description = "Typed decision packs for coding agents, powered by the Laya System 1 decision engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "lica contributors" }]
keywords = ["ai-agents", "guardrails", "laya", "typed-decisions", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Security",
]
dependencies = [
    "laya>=0.3.20",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
lica = "lica.cli:app"

[project.urls]
Homepage = "https://github.com/np9royal/lica"
Repository = "https://github.com/np9royal/lica"
Issues = "https://github.com/np9royal/lica/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lica"]

[tool.hatch.build.targets.sdist]
include = ["src/lica", "packs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download real Laya weights and run inference (deselect with -m 'not slow')",
]
addopts = "-m 'not slow'"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lica"]
