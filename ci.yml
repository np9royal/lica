name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (test deps only — laya model not needed, router is mocked)
        run: |
          pip install pydantic pyyaml typer jinja2 httpx fastapi uvicorn rich "tomli; python_version<'3.11'" pytest pytest-asyncio ruff
          pip install -e . --no-deps
      - run: ruff check . && ruff format --check .
      - run: pytest
